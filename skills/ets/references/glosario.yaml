# Glosario ETS v0.1: entradas por concepto.
#
# Cada entrada describe un concepto, no una palabra. El verificador usa:
#   - desaconsejados: formas que se marcan (sugerencia en modo estándar,
#     advertencia en modo estricto).
#   - patron: si tiene la forma "término + objeto | objeto", los desaconsejados
#     solo se marcan cuando la oración contiene uno de esos objetos.
#   - literales_ajenos: formas que se conservan si aparecen en una interfaz
#     ajena. Escríbelas entre «» para que el verificador las proteja.
#
# Subconjunto de YAML admitido: lista de mapas, valores escalares entre
# comillas dobles o listas en línea [a, "b c"]. Ver scripts/verificar.py.
# Licencia: CC BY 4.0.

# --- Equipos y dispositivos ---------------------------------------------

- id: equipo
  concepto: "Computadora personal o servidor en el que se instala o ejecuta software"
  preferido: "equipo"
  categoria: sustantivo
  patron: ""
  admitidos: ["PC", "servidor"]
  desaconsejados: ["ordenador", "computadora", "computador"]
  literales_ajenos: ["Este equipo", "Mi PC"]
  restriccion: "Si «equipo» puede leerse como grupo de personas, usa el término específico: servidor, portátil o máquina virtual."
  ejemplo: "Reinicia el equipo para completar la instalación."
  contraejemplo: "Reinicia el ordenador para completar la instalación."
  en: "computer"
  perfiles: [todos]
  nota_regional: "Ordenador (España), computadora (gran parte de Latinoamérica) y computador (Chile, Colombia) se entienden, pero marcan región."
  version: "0.1"

- id: telefono
  concepto: "Teléfono móvil de una persona usuaria"
  preferido: "teléfono"
  categoria: sustantivo
  patron: ""
  admitidos: ["teléfono móvil", "dispositivo móvil"]
  desaconsejados: ["celular", "el móvil", "tu móvil", "un móvil"]
  literales_ajenos: []
  restriccion: "Usa «dispositivo» solo si el texto también incluye tabletas u otros equipos."
  ejemplo: "Escribe el código que recibiste en el teléfono."
  contraejemplo: "Escribe el código que recibiste en tu celular."
  en: "phone, mobile phone"
  perfiles: [todos]
  nota_regional: "Celular (Latinoamérica) y móvil (España) marcan región; «teléfono» se entiende en ambas."
  version: "0.1"

- id: dispositivo
  concepto: "Cualquier aparato que ejecuta la aplicación: teléfono, tableta o equipo"
  preferido: "dispositivo"
  categoria: sustantivo
  patron: ""
  admitidos: []
  desaconsejados: ["device"]
  literales_ajenos: []
  restriccion: "No uses «dispositivo» si el texto se refiere solo a teléfonos."
  ejemplo: "La sesión se cierra en todos los dispositivos."
  contraejemplo: "La sesión se cierra en todos los devices."
  en: "device"
  perfiles: [todos]
  nota_regional: ""
  version: "0.1"

# --- Acciones de interfaz -------------------------------------------------

- id: seleccionar
