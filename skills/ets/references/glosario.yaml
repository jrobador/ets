  admitidos: ["elegir"]
  desaconsejados: []
  literales_ajenos: []
  restriccion: "Si seleccionar y activar son operaciones distintas en la interfaz, nombra cada una por separado."
  ejemplo: "Selecciona «Guardar cambios»."
  contraejemplo: "Dale a «Guardar cambios»."
  en: "select, choose"
  perfiles: [todos]
  nota_regional: ""
  version: "0.1"

